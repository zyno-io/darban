version: dev
image: ''
replicas: 2

bindings:
  contractAPIGroup: darban.zyno.io

# Trust a private CA for HTTPS upstreams. Set at most one of the two names.
# When unset, upstreams are verified against the system roots.
upstreamTLS:
  caSecretName: ''
  caConfigMapName: ''
  key: ca.crt

ingress:
  enabled: false
  namespace: ''
  gatewayName: ''

resources:
  requests:
    cpu: 100m
    memory: 32Mi
  limits:
    memory: 128Mi
