version: dev
image: ''
replicas: 2

bindings:
  contractAPIGroup: darban.zyno.io

# Trust a private CA for HTTPS upstreams. Set at most one of the two names.
# When unset, upstreams are verified against the system roots.
upstreamTLS:
  caSecretName: ''
  caConfigMapName: ''
  key: ca.crt

ingress:
  enabled: false
  namespace: ''
  gatewayName: ''

# Composing large contracts peaks well above the steady state: eight
# full-size contracts peak near 120Mi. Size the limit for the largest
# contract set.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
