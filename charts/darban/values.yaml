version: dev
image: ''
replicas: 2

# Darban matches bindings keys in any letter case, but the chart reads
# contractAPIGroup, upstreamTLS, authz, services.*.origin and
# services.*.debugOrigin by their exact names to decide when to roll the pods.
# Spell every key exactly as documented.
bindings:
  contractAPIGroup: darban.zyno.io

# Darban reloads its bindings in place when the ConfigMap changes. Set true
# to also roll the pods on every bindings change. Changes that cannot reload
# always roll the pods: contractAPIGroup, upstreamTLS, and the Services that
# authz, origin and debugOrigin name outside the release namespace.
rolloutOnBindingsChange: false

# Trust a private CA for HTTPS upstreams. Set at most one of the two names.
# When unset, upstreams are verified against the system roots.
upstreamTLS:
  caSecretName: ''
  caConfigMapName: ''
  key: ca.crt

ingress:
  enabled: false
  namespace: ''
  gatewayName: ''

# Composing large contracts peaks well above the steady state: eight
# full-size contracts peak near 120Mi. Size the limit for the largest
# contract set.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
