apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  minReadySeconds: 2
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- /* Bindings reload in place. Roll the pods only for the settings that
             cannot: contractAPIGroup, upstreamTLS, and the Services named
             outside the release namespace, whose EndpointSlices are watched
             by name. */}}
        {{- $origins := list (.Values.bindings.authz | default "") }}
        {{- range $name, $service := (.Values.bindings.services | default dict) }}
        {{- $origins = append $origins ($service.origin | default "") }}
        {{- $origins = append $origins ($service.debugOrigin | default "") }}
        {{- end }}
        {{- $external := list }}
        {{- range $origins }}
        {{- $parts := splitList "." (regexReplaceAll ":[0-9]+$" (urlParse .).host "") }}
        {{- if and (gt (len $parts) 1) (ne (index $parts 1) $.Release.Namespace) }}
        {{- $external = append $external (printf "%s.%s" (index $parts 0) (index $parts 1)) }}
        {{- end }}
        {{- end }}
        checksum/restart: {{ dict "contractAPIGroup" .Values.bindings.contractAPIGroup "upstreamTLS" .Values.bindings.upstreamTLS "chartTLS" .Values.upstreamTLS "external" ($external | uniq | sortAlpha) | toJson | sha256sum }}
        {{- if .Values.rolloutOnBindingsChange }}
        checksum/bindings: {{ .Values.bindings | toJson | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: 18
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ required "image is required" .Values.image | quote }}
          args: [-namespace, {{ .Release.Namespace | quote }}]
          ports:
            - name: https
              containerPort: 8443
            - name: admin
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: admin
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- if or .Values.upstreamTLS.caSecretName .Values.upstreamTLS.caConfigMapName }}
            - name: upstream-ca
              mountPath: /etc/darban/upstream-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-bindings
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-backend-tls
        {{- if .Values.upstreamTLS.caSecretName }}
        - name: upstream-ca
          secret:
            secretName: {{ .Values.upstreamTLS.caSecretName }}
        {{- else if .Values.upstreamTLS.caConfigMapName }}
        - name: upstream-ca
          configMap:
            name: {{ .Values.upstreamTLS.caConfigMapName }}
        {{- end }}
