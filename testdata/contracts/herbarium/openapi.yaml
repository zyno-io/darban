openapi: 3.1.0
info:
  title: herbarium fixture
  version: '1'
servers:
- url: http://fixture-herbarium.darban-fixtures.svc.cluster.local:3000
security:
- clientBasic: []
paths:
  /specimens/leaves:
    get:
      operationId: readLeafSpecimens
      responses:
        '200':
          description: herbarium response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicResponse'
  /maintenance/snapshot:
    get:
      x-darban-visibility: internal
      responses:
        '200':
          description: Internal endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRecord'
components:
  securitySchemes:
    clientBasic:
      type: http
      scheme: basic
  schemas:
    PublicResponse:
      type: object
      required:
      - backend
      properties:
        backend:
          const: herbarium
    InternalRecord:
      type: object
      description: private marker
